name: Main branch release

on:
  push:
    branches: [main]
  workflow_dispatch:

# Required: release-version.yml computes the next revision from existing tags,
# so two concurrent runs would compute the same one.
concurrency:
  group: ${{ github.repository }}-main-release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  version:
    uses: halos-org/shared-workflows/.github/workflows/release-version.yml@v1.0.0-rc.1

  build-deb:
    needs: version
    uses: halos-org/shared-workflows/.github/workflows/build-deb.yml@v1.0.0-rc.1
    with:
      package-name: halos-halpi-desktop-branding
      upstream-version: ${{ needs.version.outputs.upstream-version }}
      revision: ${{ needs.version.outputs.revision }}
      apt-distro: trixie
      apt-component: hatlabs
      maintainer-name: Hat Labs Oy
      maintainer-email: info@hatlabs.fi

  stage-release:
    needs: [version, build-deb]
    permissions:
      contents: write
    uses: halos-org/shared-workflows/.github/workflows/stage-release.yml@v1.0.0-rc.1
    with:
      package-name: halos-halpi-desktop-branding
      package-description: HALPI2 branded default desktop wallpaper
      debian-version: ${{ needs.version.outputs.debian-version }}
      prerelease-tag: ${{ needs.version.outputs.prerelease-tag }}
      stable-tag: ${{ needs.version.outputs.stable-tag }}
      artifact: ${{ needs.build-deb.outputs.artifact }}
      apt-repository: hatlabs/apt.hatlabs.fi
      apt-distro: trixie
      apt-component: hatlabs

  apt-publish:
    needs: [version, stage-release]
    uses: halos-org/shared-workflows/.github/workflows/apt-publish.yml@v1.0.0-rc.1
    with:
      channel: unstable
      prerelease-tag: ${{ needs.version.outputs.prerelease-tag }}
      apt-repository: hatlabs/apt.hatlabs.fi
      apt-distro: trixie
      apt-component: hatlabs
    secrets:
      APT_REPO_PAT: ${{ secrets.APT_REPO_PAT }}
